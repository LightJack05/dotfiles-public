general{
	hide_cursor = true
	no_fade_in = false
    fail_timeout = 5000
}
background{
	monitor=
    blur_passes = 3
    blur_size = 10
    color = rgba(0,0,0,0.5)
	path = screenshot #~/.config/hypr/wallpapers/Zorin-Dark.png   # supports png, jpg, webp (no animations, though)
}

input-field {
    monitor =
    size = 900, 100
    outline_thickness = 8
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = 12 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba(89b4fabb)
    inner_color = rgba(00000000)
    font_color = rgb(FFFFFF)
    fade_on_empty = true
    fade_timeout = 3000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 10 # -1 means complete rounding (circle/oval)
    #check_color = rgba(B2FF0033)
    #fail_color = rgba(FF000033) # if authentication failed, changes outer_color and fail message color
    fail_text = <b>Authentication Failure ($ATTEMPTS)</b> # can be set to empty
    fail_transition = 100 # transition time in ms between normal outer_color and fail_color
    capslock_color = rgba(00FF0033)
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    position = 0, -20
    halign = center
    valign = center
}

auth {
    fingerprint {
        enabled = true
        ready_message=Scan fingerprint to unlock
        present_message=Verifying...
    }
}

label {
    monitor =
    text = $FPRINTPROMPT
        color = rgb(255, 255, 255, 1.0)
    font_size = 30
    font_family = Roboto Bold
    position = 0, 100
    halign = center
    valign = bottom
    shadow_passes = 20
    shadow_size = 60
}

label {
    monitor =
    text = <span> 󰌾 </span>
    color = rgba(255, 255, 255, 1.0)
    font_size = 50
    font_family = Roboto Mono NerdFont
    position = 0, -100
    halign = center
    valign = top
    shadow_passes = 20
    shadow_size = 60
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(255, 255, 255, 1.0)
    font_size = 150
    font_family = Roboto Bold
    position = 0, -400
    halign = center
    valign = top
    shadow_passes = 20
    shadow_size = 60
}

animations {
    enabled = true

    # --- Matching Bezier Curves ---
    bezier = linear, 0, 0, 1, 1
    bezier = catppuccin_standard, 0.25, 0.1, 0.25, 1
    bezier = catppuccin_decel, 0.05, 0.7, 0.1, 1
    bezier = catppuccin_accel, 0.3, 0, 0.8, 0.15
    bezier = soft_curve, 0.26, 0.26, 0.15, 1
    bezier = swipe_in, 0.25, 0.1, 0.25, 1
    bezier = swipe_out, 0.3, 0, 0.8, 0.15

    # --- Animation Tree ---

    # Global fade container
    animation = fade, 1, 5, soft_curve

        # Fade in lockscreen (when triggered)
        animation = fadeIn, 1, 0.8, swipe_in

        # Fade out back to session (after unlock)
        animation = fadeOut, 1, 0.8, swipe_out

    # Input field container
    animation = inputField, 1, 1.5, catppuccin_standard

        # Colors/gradients fade smoothly
        animation = inputFieldColors, 1, 1.2, soft_curve

        # Fade when field is empty
        animation = inputFieldFade, 1, 1.0, catppuccin_decel

        # Adaptive width animation with gentle overshoot
        animation = inputFieldWidth, 1, 1.5, catppuccin_decel, popin 40%

        # Dot entry/removal — fast accel/decel for responsiveness
        animation = inputFieldDots, 1, 0.8, catppuccin_accel
}
