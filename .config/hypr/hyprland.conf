# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

#autogenerated = 1 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/

env = XDG_CURRENT_DESKTOP,Hyprland
env = HYPRCURSOR_THEME,default
env = HYPRCURSOR_SIZE,24
env = LADSPA_PATH,/usr/lib/ladspa
env = QT_QPA_PLATFORMTHEME,qt5ct
# Create on every device!
source = ~/.config/hypr/display.conf
source = ~/.config/hypr/hyprland-device-config/device-hyprland-config.conf
source = ~/.config/hypr/workspace-rules.conf
source = ~/.config/hypr/keymaps.conf
# See https://wiki.hyprland.org/Configuring/Keywords/ for more


# Execute your favorite apps at launch
exec-once = systemctl --user import-environment XDG_RUNTIME_DIR WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar 
exec-once = swaync -c ~/.config/swaync/swaync.json -s ~/.config/swaync/swaync.css
exec-once = nm-applet --indicator
exec-once = hypridle
exec-once = wpaperd -d
exec-once = wl-paste --type text --watch cliphist store
# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf


# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

experimental {
    xx_color_management_v4 = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us_custom
    kb_variant = us_custom
    kb_model =
    kb_options = caps:super
    kb_rules =

    follow_mouse = 1
    accel_profile = flat

    touchpad {
        drag_lock = 0
        natural_scroll = yes
    	scroll_factor = 0.15
    }

    sensitivity = 1.0 # -1.0 to 1.0, 0 means no modification.

    repeat_delay = 200
    # repeat_rate = 50
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    no_focus_fallback = 1
    border_size = 2
    gaps_in = 2
    gaps_out = 4
    col.active_border = rgba(eeeeeeFF)
    col.inactive_border = rgba(31324433)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    resize_on_border = true
}

#windowrule = opacity 1 1, obsidian # replace 'obsidian' with 'Electron' if you are using older versions

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    layerrule = blur,wofi   
    layerrule = ignorezero,wofi
    rounding = 17
    
    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = true
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 2
        sharp = false
        ignore_window = true
        color = rgba(eeeeeebb)
        color_inactive = rgba(00000000)
        offset = 0 0
        scale = 0.99
    }

    dim_inactive = true
    dim_strength = 0.3
    inactive_opacity = 1 
}

animations {
    enabled = true

    # --- Bezier Curves (preserved and renamed where useful) ---
    bezier = linear, 0, 0, 1, 1
    bezier = catppuccin_standard, 0.25, 0.1, 0.25, 1     # Smooth general-purpose
    bezier = catppuccin_decel, 0.05, 0.7, 0.1, 1         # For fade & soft pops
    bezier = catppuccin_accel, 0.3, 0, 0.8, 0.15         # Faster exit motion
    bezier = soft_overshot, 0.1, 0.9, 0.15, 1.05         # Less aggressive than 'overshot'
    bezier = soft_curve, 0.26, 0.26, 0.15, 1             # For fade transitions
        # Custom for SwayNC
    bezier = swipe_in, 0.25, 0.1, 0.25, 1
    bezier = swipe_out, 0.3, 0, 0.8, 0.15

    # --- Window Animations ---
    animation = windows, 1, 1.5, swipe_in, slide
    animation = windowsIn, 1, 1.5, swipe_in, slide
    animation = windowsOut, 1, 1.5, swipe_out, slide
    animation = windowsMove, 1, 1.5, catppuccin_decel, popin 40%

    # --- Fading (More prominent in Catppuccin for smoothness) ---
    animation = fade, 1, 5, soft_curve
    animation = fadeIn, 0, 1.3, swipe_in
    #animation = fadeOut, 0, 1.3, swipe_out

    # --- Layer Animations ---
    animation = layersIn, 1, 1.2, swipe_in, slide
    animation = layersOut, 1, 0.6, swipe_out, slide
    animation = fadeLayersIn, 1, 1, swipe_in
    animation = fadeLayersOut, 1, 0.8, soft_curve

    # Workspace switch: faster, slightly overshooting for pop
    animation = workspaces, 1, 2.2, catppuccin_decel, slidefade 8%
    
    # Special workspace (like scratchpad): quick but stylish
    animation = specialWorkspace, 1, 1.5, swipe_in, slidefadevert 8%

    # --- Borders (optional polish) ---
    animation = border, 1, 5, soft_curve
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}


gestures {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more
  # workspace_swipe = on
  workspace_swipe_invert = yes
  workspace_swipe_cancel_ratio = 0.1
  workspace_swipe_touch = true
  workspace_swipe_invert = true 
}

gesture = 3, horizontal, workspace
#gesture = 3, up, scale: 0.8, fullscreen
#gesture = 3, down, scale: 0.8, special, magic

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    animate_manual_resizes = true

}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

windowrulev2 = opacity 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
windowrulev2 = noblur,class:^(xwaylandvideobridge)$
windowrulev2 = animation.border_angle_focus,class:^(.*)$,focus
windowrulev2 = tag +magic, onworkspace:special:magic
windowrulev2 = animation, class:^(swaync)$, swaycN_in, swaycN_out
layerrule = animation none, selection
layerrule = noanim, selection

xwayland {
    force_zero_scaling = 1
}
